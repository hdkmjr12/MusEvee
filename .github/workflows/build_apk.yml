name: Build MusicEvee APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Release APK (ARM64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (Zulu)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ensure Gradle Wrapper & Restore MusicEvee Android Config
        run: |
          flutter create . --platforms android
          git checkout -- android/app/src/main/ android/app/build.gradle* android/app/musevee-release.jks android/build.gradle* android/settings.gradle*
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK (ARM64 Lightweight ~20MB)
        run: flutter build apk --release --split-per-abi --target-platform android-arm64

      - name: Upload MusicEvee-APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicEvee-APK
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk MusicEvee-arm64.apk
          gh release delete v4.0.0 --yes --cleanup-tag || true
          gh release create v4.0.0 MusicEvee-arm64.apk \
            --title "MusicEvee v4.0 (Musicolet UI/UX + Downloader ARM64 ~20 MB)" \
            --notes "Release APK MusicEvee v4.0 khusus Android ARM64 (~20 MB): Reverse Engineering 1:1 Musicolet UI/UX (Dynamic Ambient Background, Embedded Lyrics USLT/APIC Ribbon & Tap-to-Seek, 8-Tab Bottom Icon Strip + Mini Player) terintegrasi penuh dengan All-in-One Downloader v3.x & Anti Double-Romaji."
