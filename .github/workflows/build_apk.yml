name: Build MusEvee APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Release APK (ARM64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (Zulu)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Gradle Wrapper & Caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-v4.8-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/build.gradle.kts', 'android/app/build.gradle.kts', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-v4.8-
            ${{ runner.os }}-gradle-v4.7-
            ${{ runner.os }}-gradle-v4.6-
            ${{ runner.os }}-gradle-v4.4-
            ${{ runner.os }}-gradle-

      - name: Ensure Gradle Wrapper & Network Mirrors
        run: |
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            flutter create . --platforms android
            git checkout -- android/
            rm -rf android/app/src/main/res/mipmap-anydpi-v26 android/app/src/main/kotlin/com/zte
          fi
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew
          mkdir -p ~/.gradle
          cat << 'EOF' >> ~/.gradle/gradle.properties
          systemProp.org.gradle.internal.http.connectionTimeout=120000
          systemProp.org.gradle.internal.http.socketTimeout=120000
          systemProp.org.gradle.internal.repository.max.tentatives=10
          systemProp.org.gradle.internal.repository.initial.backoff=2000
          EOF
          if [ -n "$FLUTTER_ROOT" ] && [ -f "$FLUTTER_ROOT/packages/flutter_tools/gradle/settings.gradle.kts" ]; then
            sed -i 's|mavenCentral()|maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }\n        mavenCentral()|g' "$FLUTTER_ROOT/packages/flutter_tools/gradle/settings.gradle.kts"
          fi
          for attempt in 1 2 3; do
            echo "Pre-warming Gradle distribution (attempt $attempt)..."
            if (cd android && ./gradlew --version --no-daemon); then
              break
            fi
            echo "Gradle download transient failure, retrying in 10s..."
            sleep 10
          done

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK (ARM64 Lightweight ~20MB)
        run: |
          success=0
          for attempt in 1 2 3; do
            echo "Building Release APK (attempt $attempt/3)..."
            if flutter build apk --release --split-per-abi --target-platform android-arm64; then
              success=1
              break
            fi
            echo "Build attempt $attempt failed, waiting 15s before retry..."
            sleep 15
          done
          if [ "$success" -ne 1 ]; then
            exit 1
          fi

      - name: Prepare Named APK (`MusEvee-v4.8-arm64.apk`)
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk MusEvee-v4.8-arm64.apk

      - name: Upload MusEvee-APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusEvee-v4.8-arm64-APK
          path: MusEvee-v4.8-arm64.apk
          if-no-files-found: error

      - name: Publish GitHub Release (`v4.8.0`)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.8.0
          name: "MusEvee v4.8 (Centralized MusEveePalette + Dark/Light Theme Toggle in Settings)"
          body: |
            ### MusEvee v4.8 — Release APK (Android ARM64 ~20 MB)
            - **Sentralisasi Token Warna `MusEveePalette` (`lib/theme/musevee_palette.dart`):** Menyatukan seluruh token permukaan, teks, aksen, dan garis batas (`bgCanvas`, `bottomBar`, `surfaceCard`, `surfaceSubtle`, `accent`, `textPrimary`, `textMuted`, `hairline`, `appBar`) ke dalam `ThemeExtension<MusEveePalette>` (`context.palette` & `context.isDarkMode`) tanpa mengubah tampilan Mode Gelap (`MusEveePalette.dark`) sedikit pun.
            - **Toggle Tema Gelap / Terang di Tab `Settings` (`SettingsView` & `SettingsProvider`):** Menambahkan bagian **"Tampilan" / "Appearance"** di atas **"Unduhan" / "Downloads"** dengan 2 pilihan tema persisten di `musevee_settings_v1.json`: **Gelap / Dark** (`ThemeMode.dark`, default) dan **Terang / Light** (`ThemeMode.light`), lengkap dengan sinkronisasi `SystemChrome.setSystemUIOverlayStyle` dan kompatibilitas mundur terhadap file JSON `v4.7`.
            - **Adaptasi `NowPlayingView` & Lirik di Mode Terang (`lib/widgets/now_playing_view.dart`):** Menyesuaikan Dynamic Ambient Background pada Mode Terang (`Color.lerp(raw, Colors.white, 0.82)!` menuju `#F6F7F9`) dan pita baris lirik aktif (`Colors.white.withValues(alpha: 0.65)` dengan teks tebal `#181A1F`), sembari menjaga scrim & teks di atas Cover Art tetap kontras.
          files: MusEvee-v4.8-arm64.apk
          draft: false
          prerelease: false
          make_latest: "true"
