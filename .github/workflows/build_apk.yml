name: Build MusEvee APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Release APK (ARM64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (Zulu)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Gradle Wrapper & Caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-v4.4-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/build.gradle.kts', 'android/app/build.gradle.kts', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-v4.4-
            ${{ runner.os }}-gradle-v4.3-
            ${{ runner.os }}-gradle-

      - name: Ensure Gradle Wrapper & Network Mirrors
        run: |
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            flutter create . --platforms android
            git checkout -- android/
            rm -rf android/app/src/main/res/mipmap-anydpi-v26 android/app/src/main/kotlin/com/zte
          fi
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew
          mkdir -p ~/.gradle
          cat << 'EOF' >> ~/.gradle/gradle.properties
          systemProp.org.gradle.internal.http.connectionTimeout=120000
          systemProp.org.gradle.internal.http.socketTimeout=120000
          systemProp.org.gradle.internal.repository.max.tentatives=10
          systemProp.org.gradle.internal.repository.initial.backoff=2000
          EOF
          if [ -n "$FLUTTER_ROOT" ] && [ -f "$FLUTTER_ROOT/packages/flutter_tools/gradle/settings.gradle.kts" ]; then
            sed -i 's|mavenCentral()|maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }\n        mavenCentral()|g' "$FLUTTER_ROOT/packages/flutter_tools/gradle/settings.gradle.kts"
          fi
          for attempt in 1 2 3; do
            echo "Pre-warming Gradle distribution (attempt $attempt)..."
            if (cd android && ./gradlew --version --no-daemon); then
              break
            fi
            echo "Gradle download transient failure, retrying in 10s..."
            sleep 10
          done

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK (ARM64 Lightweight ~20MB)
        run: |
          success=0
          for attempt in 1 2 3; do
            echo "Building Release APK (attempt $attempt/3)..."
            if flutter build apk --release --split-per-abi --target-platform android-arm64; then
              success=1
              break
            fi
            echo "Build attempt $attempt failed, waiting 15s before retry..."
            sleep 15
          done
          if [ "$success" -ne 1 ]; then
            exit 1
          fi

      - name: Prepare Named APK (`MusEvee-v4.6-arm64.apk`)
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk MusEvee-v4.6-arm64.apk

      - name: Upload MusEvee-APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusEvee-v4.6-arm64-APK
          path: MusEvee-v4.6-arm64.apk
          if-no-files-found: error

      - name: Publish GitHub Release (`v4.6.0`)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.6.0
          name: "MusEvee v4.6 (Your Playlists Mix + 3 Discovery Carousels + Offline & Auto-Locale + <5MB Data Footprint)"
          body: |
            ### MusEvee v4.6 — Release APK (Android ARM64 ~20 MB)
            - **Pembatasan Fitur Multi-Select / Mix Playlist HANYA untuk `Your playlists`:** Keenam baris *Smart Playlists* (`All songs`, `Favorites`, `Recently added`, `Recently played`, `Most played`, `Not played`) di bagian atas tidak dapat dicentang dan meredup (`opacity: 0.38`) saat mode Gabung aktif agar pengguna fokus memilih item di dalam `Your playlists`.
            - **3 Horizontal Carousels Bersampul Kecil di Tab Downloader:** Mengganti *Pencarian Cepat* lama dengan 3 baris *Horizontal Carousel* bergambar sampul kompak (`~100x100 px`, *in-memory RAM cache* `0 KB` di disk): **`For You` / `Untukmu`** (disampling dari artis favorit di perpustakaan lokal yang belum dimiliki), **`Global Trending`**, dan **`Indonesia Trending`**.
            - **Deteksi Offline Akurat & Error Banner yang Bisa Ditutup (`✕`):** Memisahkan *network/offline error* (`NetworkOfflineException`) dari *"Tidak ditemukan lagu"* dengan tampilan kartu **Offline + Tombol Segarkan / Coba Lagi**, serta menambahkan tombol tutup (`✕`) & *auto-dismiss* 5 detik pada setiap banner peringatan.
            - **Lokalisasi Otomatis Sesuai Bahasa Sistem HP (Indonesia vs English):** Mendeteksi bahasa sistem perangkat secara otomatis (`id`/`in` -> **Bahasa Indonesia**, selain itu -> **English**).
            - **Optimasi Drastis Ukuran Data Pengguna (`< 5 MB` ala Musicolet):** Mengompresi thumbnail sampul di `filesDir/covers` ke maksimal `256x256 px` JPEG (`quality: 78`, `~8–15 KB` per file) beserta migrasi kompresi otomatis saat startup, memuat sampul resolusi penuh & teks `USLT` secara *on-demand* di RAM tanpa menyimpannya mentah di JSON cache, dan membersihkan file sementara (`.tmp`/FFmpeg) secara otomatis.
          files: MusEvee-v4.6-arm64.apk
          draft: false
          prerelease: false
          make_latest: "true"
