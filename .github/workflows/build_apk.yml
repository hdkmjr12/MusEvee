name: Build MusEvee APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Release APK (ARM64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (Zulu)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter (Stable 3.47.9)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.9'
          cache: true

      - name: Cache Gradle Wrapper & Caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-v4.9-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/build.gradle.kts', 'android/app/build.gradle.kts', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-v4.9-
            ${{ runner.os }}-gradle-v4.8-
            ${{ runner.os }}-gradle-v4.7-
            ${{ runner.os }}-gradle-v4.6-
            ${{ runner.os }}-gradle-v4.4-
            ${{ runner.os }}-gradle-

      - name: Ensure Gradle Wrapper & Network Mirrors
        run: |
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            flutter create . --platforms android
            git checkout -- android/
            rm -rf android/app/src/main/res/mipmap-anydpi-v26 android/app/src/main/kotlin/com/zte
          fi
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew
          mkdir -p ~/.gradle
          cat << 'EOF' >> ~/.gradle/gradle.properties
          systemProp.org.gradle.internal.http.connectionTimeout=120000
          systemProp.org.gradle.internal.http.socketTimeout=120000
          systemProp.org.gradle.internal.repository.max.tentatives=10
          systemProp.org.gradle.internal.repository.initial.backoff=2000
          EOF
          if [ -n "$FLUTTER_ROOT" ] && [ -f "$FLUTTER_ROOT/packages/flutter_tools/gradle/settings.gradle.kts" ]; then
            sed -i 's|mavenCentral()|maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }\n        mavenCentral()|g' "$FLUTTER_ROOT/packages/flutter_tools/gradle/settings.gradle.kts"
          fi
          for attempt in 1 2 3; do
            echo "Pre-warming Gradle distribution (attempt $attempt)..."
            if (cd android && ./gradlew --version --no-daemon); then
              break
            fi
            echo "Gradle download transient failure, retrying in 10s..."
            sleep 10
          done

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK (ARM64 Lightweight ~20MB)
        run: |
          success=0
          for attempt in 1 2 3; do
            echo "Building Release APK (attempt $attempt/3)..."
            if flutter build apk --release --split-per-abi --target-platform android-arm64; then
              success=1
              break
            fi
            echo "Build attempt $attempt failed, waiting 15s before retry..."
            sleep 15
          done
          if [ "$success" -ne 1 ]; then
            exit 1
          fi

      - name: Prepare Named APK (`MusEvee-v4.9-arm64.apk`)
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk MusEvee-v4.9-arm64.apk

      - name: Upload MusEvee-APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusEvee-v4.9-arm64-APK
          path: MusEvee-v4.9-arm64.apk
          if-no-files-found: error

      - name: Publish GitHub Release (`v4.9.0`)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.9.0
          name: "MusEvee v4.9 (Hi-Res Lossless FLAC Downloads + Add-on Source Manager)"
          body: |
            ### MusEvee v4.9 — Release APK (Android ARM64 ~20 MB)
            - **Unduhan Hi-Res Lossless `.flac` (`DownloadQuality.hiResFlac` & `HiResAddonService`):** Menambahkan opsi kualitas unduhan tertinggi **Hi-Res Lossless — FLAC (16/24-bit)** dengan *waterfall resolver* cepat ber-timeout ketat (`6s`), verifikasi *magic header* biner `fLaC` (`0x66 0x4C 0x61 0x43`), serta *Smart Fallback* otomatis ke **MP3 320 kbps** jika lagu tidak tersedia di katalog Hi-Res.
            - **Pengelola Sumber Add-on Hi-Res (`SettingsProvider` & `SettingsView`):** Menanamkan preset bawaan (`https://tracks.monochrome.st` pada urutan `#1` + 7 preset modul BitChord/8spine) lengkap dengan Modal Bottom Sheet **Kelola Sumber Add-on Hi-Res** (`ReorderableListView`, prioritas drag-and-drop, toggle ON/OFF, cek status ping, reset preset, dan tambah URL add-on manual).
            - **Tagging Lossless `.flac` (`TaggingService`) & Parser Biner `fLaC` Native (`MainActivity.kt`):** Menyematkan blok biner `VORBIS_COMMENT` (termasuk `LYRICS` & `UNSYNCEDLYRICS`) dan `METADATA_BLOCK_PICTURE` (`1000x1000` sampul album) tanpa *re-encoding* (`-c:a copy`), serta pembaca native blok `fLaC` di Android untuk menampilkan lirik berjalan `.flac` di panggung 3-panel `NowPlayingView`.
          files: MusEvee-v4.9-arm64.apk
          draft: false
          prerelease: false
          make_latest: "true"
