name: Build MusEvee APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Release APK (ARM64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (Zulu)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ensure Gradle Wrapper & Restore MusEvee Android Config
        run: |
          flutter create . --platforms android
          git checkout -- android/app/src/main/ android/app/build.gradle* android/app/musevee-release.jks android/build.gradle* android/settings.gradle*
          rm -rf android/app/src/main/res/mipmap-anydpi-v26 android/app/src/main/kotlin/com/zte

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK (ARM64 Lightweight ~20MB)
        run: flutter build apk --release --split-per-abi --target-platform android-arm64

      - name: Upload MusEvee-APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusEvee-APK
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk MusEvee-arm64.apk
          gh release delete v4.2.0 --yes --cleanup-tag || true
          gh release create v4.2.0 MusEvee-arm64.apk \
            --title "MusEvee v4.2 (Playlists + ZTE/nubia Live Island + Cross-Script J-Pop Search)" \
            --notes "Release APK MusEvee v4.2 khusus Android ARM64 (~20 MB): Logo transparan baru, tab Playlists dengan Spotify Batch Auto-Sync & Smart Deduplication, dukungan penuh Native MediaSession Notification & ZTE/nubia Live Island (applicationId com.zte.as.music), micro-animations, Scoped Storage Android 15, serta pencarian lagu Jepang lintas-aksara (Romaji -> Kanji/Kana)."
