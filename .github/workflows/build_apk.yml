name: Build MusEvee APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Release APK (ARM64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (Zulu)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Gradle Wrapper & Caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-v4.3-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/build.gradle.kts', 'android/app/build.gradle.kts', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-v4.3-
            ${{ runner.os }}-gradle-

      - name: Ensure Gradle Wrapper & Network Mirrors
        run: |
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            flutter create . --platforms android
            git checkout -- android/
            rm -rf android/app/src/main/res/mipmap-anydpi-v26 android/app/src/main/kotlin/com/zte
          fi
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew
          mkdir -p ~/.gradle
          cat << 'EOF' >> ~/.gradle/gradle.properties
          systemProp.org.gradle.internal.http.connectionTimeout=120000
          systemProp.org.gradle.internal.http.socketTimeout=120000
          systemProp.org.gradle.internal.repository.max.tentatives=10
          systemProp.org.gradle.internal.repository.initial.backoff=2000
          EOF
          if [ -n "$FLUTTER_ROOT" ] && [ -f "$FLUTTER_ROOT/packages/flutter_tools/gradle/settings.gradle.kts" ]; then
            sed -i 's|mavenCentral()|maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }\n        mavenCentral()|g' "$FLUTTER_ROOT/packages/flutter_tools/gradle/settings.gradle.kts"
          fi
          for attempt in 1 2 3; do
            echo "Pre-warming Gradle distribution (attempt $attempt)..."
            if (cd android && ./gradlew --version --no-daemon); then
              break
            fi
            echo "Gradle download transient failure, retrying in 10s..."
            sleep 10
          done

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK (ARM64 Lightweight ~20MB)
        run: |
          success=0
          for attempt in 1 2 3; do
            echo "Building Release APK (attempt $attempt/3)..."
            if flutter build apk --release --split-per-abi --target-platform android-arm64; then
              success=1
              break
            fi
            echo "Build attempt $attempt failed, waiting 15s before retry..."
            sleep 15
          done
          if [ "$success" -ne 1 ]; then
            exit 1
          fi

      - name: Prepare Named APK (`MusEvee-v4.3-arm64.apk`)
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk MusEvee-v4.3-arm64.apk

      - name: Upload MusEvee-APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusEvee-v4.3-arm64-APK
          path: MusEvee-v4.3-arm64.apk
          if-no-files-found: error

      - name: Publish GitHub Release (`v4.3.0`)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.3.0
          name: "MusEvee v4.3 (Universal Folder Scanner + Folder Manager + Permission Onboarding)"
          body: |
            ### MusEvee v4.3 — Release APK (Android ARM64 ~20 MB)
            - **Universal Audio Folder Scanner + Strict Anti-Junk Filter:** Memindai seluruh folder musik di penyimpanan (`/Music/`, `/Download/`, `/Audio/`, `/Songs/`, dll.) dengan syarat durasi `>= 15s` (atau ukuran `>= 50 KB`) dan mem-blacklist folder non-musik (`WhatsApp Audio`, `Voice Notes`, `Recordings`, `CallRecord`, `Ringtones`, `Alarms`, `Notifications`, `/Android/*`, `/.`).
            - **Kelola / Sembunyikan Folder (`musevee_hidden_folders_v1.json`):** Bottom sheet di tab `Folders` untuk menampilkan atau menyembunyikan folder tertentu beserta jumlah lagunya tanpa menghapus file fisik.
            - **Smart Default Folders:** Tidak lagi memaksa pembuatan 3 folder kosong di HP pengguna baru; otomatis mengenali subfolder yang sudah ada (`Music Barat`, `Music Japan`, `Music Random`, dll.) atau menyediakan 1 default netral (`MusEvee`).
            - **First-Run Permission Onboarding & Live Island Status Dialog:** Banner setup izin 1-klik (*All Files Access* & *POST_NOTIFICATIONS*) dengan deteksi otomatis saat kembali ke aplikasi (`AppLifecycleState.resumed`) serta dialog Info MusEvee & panduan ZTE/nubia Live Island.
            - **Perbaikan Playlist Spotify Private & Dukungan Token `?pt=`:** Meneruskan parameter `?pt=` ke endpoint Spotify Embed/Web, menghapus fallback pencarian acak ke iTunes/Deezer saat playlist gagal diekstrak, dan menampilkan dialog peringatan edukatif.
          files: MusEvee-v4.3-arm64.apk
          draft: false
          prerelease: false
          make_latest: "true"
