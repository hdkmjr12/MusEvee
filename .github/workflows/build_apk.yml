name: Build MusEvee APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Release APK (ARM64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (Zulu)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Gradle Wrapper & Caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-v4.7-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/build.gradle.kts', 'android/app/build.gradle.kts', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-v4.7-
            ${{ runner.os }}-gradle-v4.6-
            ${{ runner.os }}-gradle-v4.4-
            ${{ runner.os }}-gradle-

      - name: Ensure Gradle Wrapper & Network Mirrors
        run: |
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            flutter create . --platforms android
            git checkout -- android/
            rm -rf android/app/src/main/res/mipmap-anydpi-v26 android/app/src/main/kotlin/com/zte
          fi
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew
          mkdir -p ~/.gradle
          cat << 'EOF' >> ~/.gradle/gradle.properties
          systemProp.org.gradle.internal.http.connectionTimeout=120000
          systemProp.org.gradle.internal.http.socketTimeout=120000
          systemProp.org.gradle.internal.repository.max.tentatives=10
          systemProp.org.gradle.internal.repository.initial.backoff=2000
          EOF
          if [ -n "$FLUTTER_ROOT" ] && [ -f "$FLUTTER_ROOT/packages/flutter_tools/gradle/settings.gradle.kts" ]; then
            sed -i 's|mavenCentral()|maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }\n        mavenCentral()|g' "$FLUTTER_ROOT/packages/flutter_tools/gradle/settings.gradle.kts"
          fi
          for attempt in 1 2 3; do
            echo "Pre-warming Gradle distribution (attempt $attempt)..."
            if (cd android && ./gradlew --version --no-daemon); then
              break
            fi
            echo "Gradle download transient failure, retrying in 10s..."
            sleep 10
          done

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK (ARM64 Lightweight ~20MB)
        run: |
          success=0
          for attempt in 1 2 3; do
            echo "Building Release APK (attempt $attempt/3)..."
            if flutter build apk --release --split-per-abi --target-platform android-arm64; then
              success=1
              break
            fi
            echo "Build attempt $attempt failed, waiting 15s before retry..."
            sleep 15
          done
          if [ "$success" -ne 1 ]; then
            exit 1
          fi

      - name: Prepare Named APK (`MusEvee-v4.7-arm64.apk`)
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk MusEvee-v4.7-arm64.apk

      - name: Upload MusEvee-APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusEvee-v4.7-arm64-APK
          path: MusEvee-v4.7-arm64.apk
          if-no-files-found: error

      - name: Publish GitHub Release (`v4.7.0`)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.7.0
          name: "MusEvee v4.7 (Settings Tab + Configurable MP3 Bitrate 320/192/128 kbps + Integrated All Songs Search)"
          body: |
            ### MusEvee v4.7 — Release APK (Android ARM64 ~20 MB)
            - **Tab Ke-6 Baru `Settings` (`SettingsView` & `SettingsProvider`):** Menggantikan tab `Search Lokal` lama di urutan ke-6 `MusicoletBottomStrip` dengan halaman **Pengaturan / Settings** bergaya Musicolet Dark (`#0E1014` / `#17191E`, hairline border `0.8px`) yang persisten di `musevee_settings_v1.json`.
            - **Pilihan Kualitas Unduhan MP3 (`320` / `192` / `128 kbps`):** Mendukung 3 opsi kualitas konversi FFmpeg di `TaggingService.convertAndTagAudio()` dan `DownloaderProvider`: **Terbaik — 320 kbps** (`~9-10 MB per lagu 4 menit`, default), **Seimbang — 192 kbps** (`~5-6 MB per lagu 4 menit`), dan **Hemat — 128 kbps** (`~3-4 MB per lagu 4 menit`), lengkap dengan catatan jelas bahwa pengaturan ini hanya memengaruhi ukuran file hasil unduhan di penyimpanan HP.
            - **Integrasi Pencarian Lokal di Dalam `All songs` + Tombol Shortcut Cepat (`LocalPlaylistsView` & `LocalFoldersView`):** Memindahkan bar pencarian lokal permanen beserta chip filter Favorit (`♥`) langsung ke bagian atas drill-down **All songs** di tab `Playlists` (otomatis mereset kata kunci saat menekan tombol Kembali), serta menambahkan tombol shortcut pencarian cepat (`Icons.search_rounded`) di header tab `Folders` dan `Playlists` yang langsung membuka `All songs` dan memfokuskan kolom pencarian.
          files: MusEvee-v4.7-arm64.apk
          draft: false
          prerelease: false
          make_latest: "true"
