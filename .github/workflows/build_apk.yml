name: Build MusEvee APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Release APK (ARM64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (Zulu)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Gradle Wrapper & Caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-v4.4-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/build.gradle.kts', 'android/app/build.gradle.kts', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-v4.4-
            ${{ runner.os }}-gradle-v4.3-
            ${{ runner.os }}-gradle-

      - name: Ensure Gradle Wrapper & Network Mirrors
        run: |
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            flutter create . --platforms android
            git checkout -- android/
            rm -rf android/app/src/main/res/mipmap-anydpi-v26 android/app/src/main/kotlin/com/zte
          fi
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew
          mkdir -p ~/.gradle
          cat << 'EOF' >> ~/.gradle/gradle.properties
          systemProp.org.gradle.internal.http.connectionTimeout=120000
          systemProp.org.gradle.internal.http.socketTimeout=120000
          systemProp.org.gradle.internal.repository.max.tentatives=10
          systemProp.org.gradle.internal.repository.initial.backoff=2000
          EOF
          if [ -n "$FLUTTER_ROOT" ] && [ -f "$FLUTTER_ROOT/packages/flutter_tools/gradle/settings.gradle.kts" ]; then
            sed -i 's|mavenCentral()|maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }\n        mavenCentral()|g' "$FLUTTER_ROOT/packages/flutter_tools/gradle/settings.gradle.kts"
          fi
          for attempt in 1 2 3; do
            echo "Pre-warming Gradle distribution (attempt $attempt)..."
            if (cd android && ./gradlew --version --no-daemon); then
              break
            fi
            echo "Gradle download transient failure, retrying in 10s..."
            sleep 10
          done

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK (ARM64 Lightweight ~20MB)
        run: |
          success=0
          for attempt in 1 2 3; do
            echo "Building Release APK (attempt $attempt/3)..."
            if flutter build apk --release --split-per-abi --target-platform android-arm64; then
              success=1
              break
            fi
            echo "Build attempt $attempt failed, waiting 15s before retry..."
            sleep 15
          done
          if [ "$success" -ne 1 ]; then
            exit 1
          fi

      - name: Prepare Named APK (`MusEvee-v4.4-arm64.apk`)
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk MusEvee-v4.4-arm64.apk

      - name: Upload MusEvee-APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusEvee-v4.4-arm64-APK
          path: MusEvee-v4.4-arm64.apk
          if-no-files-found: error

      - name: Publish GitHub Release (`v4.4.0`)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.4.0
          name: "MusEvee v4.4 (6-Tab Sliding Nav + Live Equalizer + Multi-Folder/Playlist Queue Merger)"
          body: |
            ### MusEvee v4.4 — Release APK (Android ARM64 ~20 MB)
            - **Navigasi Bawah 6 Tab + Modal Bottom Sheet Antrean Unduhan (`88%`):** Merampingkan bottom strip dari 7 menjadi 6 tab utama (`Queue`, `Now Playing`, `Folders`, `Playlists`, `Downloader`, `Search Lokal`), menambahkan tombol kompak **Antrean & Riwayat Unduhan** dengan *mini progress ring* & badge di sebelah kanan kolom pencarian Omnibox, serta membuka `QueueHistoryView` sebagai Modal Bottom Sheet `88%` tinggi layar.
            - **Sliding Pill Indicator & Directional Slide-Fade Transition:** Indikator garis putih `2.5px` di bawah `MusicoletBottomStrip` kini meluncur mulus secara horizontal (`AnimatedPositioned`, `Curves.easeOutCubic`, `240ms`) dipadukan dengan transisi halaman geser-pudar searah (`dx: ±0.03`, `200ms`).
            - **Live Animated Equalizer Bars (`AnimatedEqualizerIcon`):** Indikator 4 batang equalizer hidup berbalut `RepaintBoundary` pada baris lagu yang sedang aktif di tab **Queue**, **Folders**, **Playlists**, dan **Search Lokal** yang bergerak organik saat diputar dan otomatis mendatar saat dijeda.
            - **Multi-Folder & Multi-Playlist Queue Merger (`playCombinedFolders` & `playCombinedPlaylists`):** Mode pilih banyak (*multi-select* via tombol header atau *long-press*) di tab `Folders` dan `Playlists` lengkap dengan **Floating Action Bar** (`▶ Putar`, `🔀 Shuffle Mix` Fisher-Yates merata lintas folder/playlist, dan `➕ + Queue` dengan deduplikasi `filePath` otomatis) serta opsi cepat **"+ Queue"** di menu titik tiga (`⋮`).
          files: MusEvee-v4.4-arm64.apk
          draft: false
          prerelease: false
          make_latest: "true"
