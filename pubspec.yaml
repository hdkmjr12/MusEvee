name: spotmeta_downloader
description: "MusicEvee - Pemutar musik lokal bergaya Musicolet (Embedded USLT Lyrics) terintegrasi dengan All-in-One Music & Spotify Downloader."
publish_to: 'none'
version: 4.1.0+5

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  dio: ^5.7.0
  html: ^0.15.4
  youtube_explode_dart: ^3.1.0
  ffmpeg_kit_flutter_new_audio: ^2.5.8
  path_provider: ^2.1.4
  permission_handler: ^11.3.1

dependency_overrides:
  path_provider_android: 2.2.15

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

